<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="metalGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#242836"/>
      <stop offset="45%" stop-color="#12151d"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#metalGlow)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="225" x2="800" y2="225" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <circle cx="400" cy="175" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5"/>
  <circle cx="400" cy="175" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- Unreal Emblem Outer Ring -->
  <circle cx="400" cy="175" r="78" fill="#0d0f14" stroke="url(#ringGrad)" stroke-width="7"/>
  <circle cx="400" cy="175" r="70" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Stylized U Icon -->
  <g fill="#ffffff" transform="translate(400, 175) scale(1.15)">
    <!-- Center circle & spikes -->
    <circle cx="0" cy="0" r="12" fill="#ffffff" />
    <path d="M -8 -38 C -4 -18 -4 10 -4 20 C -4 30 0 35 0 35 C 0 35 4 30 4 20 C 4 10 4 -18 8 -38 Z" fill="#0d0f14"/>
    <!-- Left U wing -->
    <path d="M -22 -36 C -18 -15 -14 12 -12 20 C -9 29 0 34 0 34 C -12 30 -22 18 -26 -10 C -28 -22 -26 -30 -22 -36 Z" fill="#ffffff"/>
    <!-- Right U wing -->
    <path d="M 22 -36 C 18 -15 14 12 12 20 C 9 29 0 34 0 34 C 12 30 22 18 26 -10 C 28 -22 26 -30 22 -36 Z" fill="#ffffff"/>
    <!-- Side barb left -->
    <path d="M -26 -12 C -34 -4 -38 10 -34 22 C -28 15 -24 8 -22 2 Z" fill="#ffffff"/>
    <!-- Side barb right -->
    <path d="M 26 -12 C 34 -4 38 10 34 22 C 28 15 24 8 22 2 Z" fill="#ffffff"/>
  </g>

  <!-- Typography matching exact screenshot -->
  <text x="400" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="10" fill="#ffffff">UNREAL</text>
  <text x="400" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="12" fill="#94a3b8">ENGINE</text>
</svg>
